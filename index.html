<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#14161b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Log</title>
<style>
  :root{
    --iron:#14161b; --plate:#1e222a; --steel:#2c313c; --steel-hi:#3a4150;
    --chalk:#edefe8; --dust:#98a0ac; --dim:#6a7280;
    --amber:#f0b23e; --amber-deep:#c8880f;
    --good:#7fc98a; --warn:#e2984d; --bad:#e07a6a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--iron); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom));}
  button{font-family:inherit; border:none; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .wrap{max-width:520px; margin:0 auto; padding:18px 16px 0;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--dust);}
  h1.app{font-size:22px; font-weight:800; letter-spacing:-.01em; margin:2px 0 0;}
  h1.app .amp{color:var(--amber);}
  .headrow{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:14px;}
  .headright{display:flex; align-items:center; gap:10px;}
  .datechip{font-size:12px; color:var(--dust); font-weight:600;}
  .gear{background:var(--steel); color:var(--dust); width:34px; height:34px; border-radius:10px; font-size:16px;}

  .card{background:var(--plate); border:1px solid var(--steel); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;}
  .card h2{font-size:15px; font-weight:800; margin:0 0 8px; letter-spacing:.01em;}
  .muted{color:var(--dust); font-size:13px; line-height:1.45;}
  .small{font-size:12px;}

  .btn{display:block; width:100%; padding:15px; border-radius:12px; font-size:16px; font-weight:800;
    background:var(--amber); color:#171102; letter-spacing:.02em;}
  .btn:active{transform:scale(.985);}
  .btn.ghost{background:var(--steel); color:var(--chalk); font-weight:700;}
  .btn.quiet{background:transparent; color:var(--dust); font-weight:600; font-size:14px; padding:10px;}
  .btn.danger{background:transparent; color:var(--bad); border:1px solid var(--steel); font-weight:700;}
  .btn.confirming{background:var(--bad); color:#fff; border-color:var(--bad);}
  .btn[disabled]{opacity:.45;}
  .row{display:flex; gap:10px;}
  .row .btn{flex:1;}

  .seg{display:flex; gap:6px; margin-top:6px;}
  .seg button{flex:1; padding:11px 4px; border-radius:10px; background:var(--steel); color:var(--dust);
    font-size:13px; font-weight:700;}
  .seg button.on{background:var(--chalk); color:#14161b;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dust);}

  .planline{padding:10px 0; border-bottom:1px solid var(--steel);}
  .planline:last-child{border-bottom:none;}
  .planline .toprow{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .planline .nm{font-weight:700; font-size:15px;}
  .planline .eq{font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--amber); background:#2a2415; border-radius:5px; padding:2px 6px; vertical-align:2px; margin-left:6px;}
  .planline .rx{color:var(--dust); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .basis{font-size:12px; color:var(--dim); margin-top:2px;}
  .why{border-left:3px solid var(--amber); padding:2px 0 2px 12px; margin:10px 0 4px; color:var(--dust); font-size:13px; line-height:1.5;}
  .modline{display:flex; gap:8px; align-items:baseline; margin-top:6px; font-size:13px; color:var(--dust); line-height:1.45;}
  .modline .tag{color:var(--amber); font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;}
  .swapbtn{background:var(--steel); color:var(--dust); font-size:12px; font-weight:700; padding:6px 10px;
    border-radius:8px; margin-top:6px;}
  .picker{margin-top:8px; border:1px solid var(--steel-hi); border-radius:10px; overflow:hidden;}
  .picker button{display:flex; justify-content:space-between; width:100%; padding:11px 12px; background:#191c22;
    color:var(--chalk); font-size:14px; font-weight:600; border-bottom:1px solid var(--steel); text-align:left; gap:10px;}
  .picker button:last-child{border-bottom:none;}
  .picker button .w{color:var(--dust); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .picker button:active{background:var(--steel);}

  .now{background:var(--plate); border:1px solid var(--steel-hi); border-radius:var(--radius); padding:18px 16px; margin-bottom:12px;}
  .now .exname{font-size:20px; font-weight:800; letter-spacing:-.01em;}
  .now .cue{color:var(--dust); font-size:13px; margin-top:4px; line-height:1.45;}
  .guidetoggle{background:none; color:var(--amber); font-size:13px; font-weight:700; padding:6px 0; margin-top:4px;}
  .guide{margin-top:6px; background:#191c22; border:1px solid var(--steel); border-radius:10px; padding:12px 14px;}
  .guide ol{margin:0 0 8px; padding-left:18px; color:var(--chalk); font-size:13px; line-height:1.6;}
  .guide .mist{color:var(--warn); font-size:12px; line-height:1.5;}
  .guide a{color:var(--amber); font-size:13px; font-weight:700; text-decoration:none;}
  .setlabel{margin-top:14px; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--dust);}
  .bignum{display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 2px;}
  .bignum .val{font-size:64px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1;}
  .bignum .unit{font-size:14px; color:var(--dust); font-weight:700; align-self:flex-end; padding-bottom:10px;}
  .step{width:56px; height:56px; border-radius:50%; background:var(--steel); color:var(--chalk); font-size:26px; font-weight:700;}
  .step:active{background:var(--steel-hi);}
  .minirow{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:2px;}
  .minirow .val2{font-size:34px; font-weight:800; min-width:56px; text-align:center; font-variant-numeric:tabular-nums;}
  .step.sm{width:44px; height:44px; font-size:20px;}
  .rpes{display:flex; gap:5px; margin-top:8px;}
  .rpes button{flex:1; padding:10px 0; border-radius:9px; background:var(--steel); color:var(--dust); font-weight:800; font-size:13px;}
  .rpes button.on{background:var(--chalk); color:#14161b;}
  .rpes button.pain{color:var(--bad);}
  .rpes button.pain.on{background:var(--bad); color:#fff;}
  .coachline{margin-top:12px; padding:11px 12px; border-radius:10px; background:#191c22; border:1px solid var(--steel);
    font-size:14px; line-height:1.45;}
  .coachline.good{border-color:#3c5c43;} .coachline.warn{border-color:#6b5230;} .coachline.bad{border-color:#6b3a33;}
  .coachline.pr{border-color:var(--amber); background:#241f12;}
  .setdots{display:flex; gap:6px; margin-top:10px;}
  .setdots span{flex:1; height:5px; border-radius:3px; background:var(--steel);}
  .setdots span.done{background:var(--amber);}
  .setdots span.extra{background:var(--good);}
  .resttimer{text-align:center; font-size:13px; color:var(--dust); margin-top:10px; font-variant-numeric:tabular-nums;}
  .resttimer b{color:var(--chalk); font-size:16px;}
  .resttimer .quip{display:block; margin-top:3px; font-size:12px; color:var(--dim); font-style:italic;}
  .restdone{animation:flash .8s ease 2;}
  @keyframes flash{0%,100%{background:var(--plate)}50%{background:#33301c}}
  .loggedsets{margin-top:8px; color:var(--dust); font-size:13px; font-variant-numeric:tabular-nums;}
  .navrow{display:flex; gap:8px; margin-top:8px;}
  .navrow .btn{flex:1;}

  .sess{padding:12px 0; border-bottom:1px solid var(--steel);}
  .sess:last-child{border-bottom:none;}
  .sess .top{display:flex; justify-content:space-between; font-weight:700; font-size:14px;}
  .sess .top .d{color:var(--dust); font-weight:600;}
  .sess .lines{margin-top:5px; color:var(--dust); font-size:13px; line-height:1.55; font-variant-numeric:tabular-nums;}
  .editlink{background:none; color:var(--amber); font-size:12px; font-weight:700; padding:4px 0;}
  .prog{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--steel); font-size:14px;}
  .prog:last-child{border-bottom:none;}
  .prog .tr{color:var(--dust); font-variant-numeric:tabular-nums; font-size:13px;}
  .up{color:var(--good);} .flat{color:var(--dust);} .down{color:var(--warn);}

  .editset{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .editset input{width:70px; background:#191c22; border:1px solid var(--steel); border-radius:8px; color:var(--chalk);
    padding:9px; font-size:15px; text-align:center;}
  .editset .x{background:var(--steel); color:var(--bad); border-radius:8px; width:36px; height:36px; font-weight:800;}
  .editex{margin:12px 0; padding-bottom:10px; border-bottom:1px solid var(--steel);}
  .editex .nm{font-weight:700; font-size:14px; margin-bottom:2px;}

  .togglerow{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--steel);}
  .togglerow:last-child{border-bottom:none;}
  .togglerow .lbl{font-weight:700; font-size:14px;}
  .togglerow .sub{color:var(--dust); font-size:12px; margin-top:2px;}
  .toggle{width:52px; height:30px; border-radius:15px; background:var(--steel); position:relative; transition:background .15s;}
  .toggle.on{background:var(--amber);}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:var(--chalk); transition:left .15s;}
  .toggle.on::after{left:25px;}

  .chat{display:flex; flex-direction:column; gap:10px; margin-bottom:12px;}
  .msg{max-width:88%; padding:11px 13px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap;}
  .msg.me{align-self:flex-end; background:var(--steel-hi); border-bottom-right-radius:4px;}
  .msg.ai{align-self:flex-start; background:var(--plate); border:1px solid var(--steel); border-bottom-left-radius:4px;}
  .chatbar{display:flex; gap:8px;}
  .chatbar textarea{flex:1; background:var(--plate); border:1px solid var(--steel); border-radius:12px; color:var(--chalk);
    padding:12px; font-size:15px; resize:none; height:48px;}
  .chatbar button{width:64px; border-radius:12px; background:var(--amber); font-weight:800; color:#171102;}

  .tabs{position:fixed; bottom:0; left:0; right:0; background:rgba(20,22,27,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--steel); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  .tabs button{flex:1; background:none; color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; padding:8px 0;}
  .tabs button .ic{display:block; font-size:20px; margin-bottom:3px;}
  .tabs button.on{color:var(--amber);}

  .banner{background:#241f12; border:1px solid #4a3c14; color:#e8cf8a; border-radius:12px; padding:11px 13px;
    font-size:13px; line-height:1.45; margin-bottom:12px;}
  .hide{display:none;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid var(--dust); border-top-color:transparent;
    border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} .btn:active{transform:none} .restdone{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="headrow">
    <div>
      <div class="eyebrow">Personal Trainer</div>
      <h1 class="app">Nourin<span class="amp"> / </span>Iron Log</h1>
    </div>
    <div class="headright">
      <div class="datechip" id="dateChip"></div>
      <button class="gear" onclick="go('settings')">⚙︎</button>
    </div>
  </div>
  <div id="view"></div>
</div>

<div class="tabs">
  <button id="tabToday" class="on" onclick="go('today')"><span class="ic">🏋️</span>Today</button>
  <button id="tabFuel" onclick="go('fuel')"><span class="ic">🍳</span>Fuel</button>
  <button id="tabHistory" onclick="go('history')"><span class="ic">📈</span>History</button>
  <button id="tabCoach" onclick="go('coach')"><span class="ic">💬</span>Coach</button>
</div>

<script>
/* ============================================================
   0. PERSONALITY — one voice, many lines. Pain and recovery
   messaging stays sincere; the jokes are for everything else.
   ============================================================ */
const rnd = a => a[Math.floor(Math.random()*a.length)];
const FLAVOR = {
  checkinSub:[
    "30 seconds of honesty. The plan is only as smart as your answers.",
    "Tell me the truth — the dumbbells will find out anyway.",
    "Quick vibe check. This actually changes today's plan, promise.",
    "Be honest. Lying to your training log is a very niche crime."],
  planBtn:["Start workout","Let's go","Clock in"],
  goodSet:[
    "Good. Keep {w} lb for set {n}.",
    "Clean work. Same {w} lb for set {n}.",
    "That's the stuff. {w} lb again, set {n}.",
    "Solid. The {w} lb stays for set {n}."],
  goodFinal:[
    "Good set to finish on.",
    "And that's a wrap on this one. Nicely done.",
    "Clean finish. The next exercise is getting nervous."],
  easySet:[
    "Easy at {w} lb. Stay here for set {n} — if it's still a 6, we bump next session, not mid-workout.",
    "Almost suspiciously easy. Keep {w} lb for set {n}; the increase comes next session, earned properly.",
    "Smooth. Same {w} lb for set {n} — patience today buys progress Thursday."],
  easyFinal:[
    "Comfortable across the board — flagged for a small increase next session.",
    "That looked easy from here. Noted: small bump next time.",
    "Cruise control. Next session this goes up a notch."],
  hardSet:[
    "Harder than planned. Keep {w} lb but stop each remaining set 2 reps earlier — quality over count.",
    "That one cost you. Same {w} lb, but bank 2 extra reps in reserve on the rest."],
  hardFinal:[
    "Tough final set — good place to end it.",
    "A grind, but a finished grind. That still counts double."],
  grindSet:[
    "That was a grind. Drop to {w} lb for the remaining {r} — nothing is gained by failing reps today.",
    "Too heavy today, and that's fine. {w} lb for the remaining {r}. The ego lifts nothing."],
  grindFinal:[
    "That was a grind. Log {w} lb next time — nothing is gained by failing reps.",
    "Rough one. We'll come back at {w} lb — strategic retreat, not defeat."],
  pr:[
    "🔔 PR! That's the heaviest you've ever done on this. Write it in the sky.",
    "🔔 Personal record. Past-you could not have done that.",
    "🔔 PR alert. The strength trend chart just got prettier."],
  rest:[
    "Breathe. The weights aren't going anywhere.",
    "Shake it out. Scrolling is legal but hydrating is better.",
    "Rest is part of the set. This is you, working.",
    "Inhale, exhale. The next set already respects you.",
    "Professional resting in progress."],
  finish:[
    "Another deposit in the strength bank. Compound interest applies.",
    "Done. Somewhere, a future version of you just got stronger.",
    "That's the whole job: show up, log sets, leave. Executed.",
    "Workout saved. Protein and smugness are both appropriate now."],
  finishEarly:[
    "Partial counts. A short workout beats a perfect plan that didn't happen.",
    "Logged. Half a workout is infinity percent more than zero."],
  recoveryLog:[
    "Logged. Rest days are where the muscle actually gets built — today you're technically gaining.",
    "Smart. Recovery is training you can do lying down."],
  emptyHistory:[
    "Nothing yet. Today is a good day to change that.",
    "Empty, for now. Every legend's training log started at zero rows."],
  bwSub:[
    "Weekly is plenty. The trend matters — single days are just weather.",
    "Log it weekly. Daily weigh-ins are how scales gaslight people."]
};
const F = (tpl,vars) => tpl.replace(/\{(\w+)\}/g,(_,k)=>vars[k]);

/* ============================================================
   1. EXERCISE LIBRARY — 43 exercises across dumbbell, barbell,
   cable, machine, and bodyweight. Swaps and rotation stay inside
   the same movement pattern, so alternatives hit the same muscles.
   ============================================================ */
const EQUIP_LABEL = {db:"Dumbbell", bb:"Barbell", cable:"Cable", machine:"Machine", bw:"Bodyweight"};
const LIB = {
  /* --- horizontal push --- */
  chest_press:{name:"Chest Press", pat:"hpush", equip:"machine", start:10, inc:2.5, reps:[8,12], rest:90,
    cue:"Shoulder blades back and down. Press smooth, no bounce at the bottom.",
    how:["Set the seat so handles line up with mid-chest.","Pull shoulder blades back and down into the pad — keep them there.","Press out smoothly until arms are almost straight.","Lower with control for a 2-count; don't let the weight slam back."],
    mist:"Common mistakes: shrugging shoulders toward ears; bouncing at the bottom; flaring elbows straight out."},
  db_flat_press:{name:"DB Bench Press", pat:"hpush", equip:"db", start:7.5, inc:2.5, reps:[8,12], rest:90,
    cue:"DBs over mid-chest. Lower until elbows dip just below the bench.",
    how:["Lie on a flat bench, DBs at chest level, palms forward.","Plant feet, keep shoulder blades pinched into the bench.","Press up until arms are nearly straight, DBs over mid-chest.","Lower slowly until elbows dip just below shoulder level."],
    mist:"Common mistakes: clanging DBs at the top; bouncing out of the bottom; wrists bending backward."},
  db_incline_press:{name:"Incline DB Press", pat:"hpush", equip:"db", start:7.5, inc:2.5, reps:[8,12], rest:90,
    cue:"Bench at ~30°. Press up and slightly back, DBs over your upper chest.",
    how:["Set an adjustable bench to about 30 degrees.","Start with DBs at shoulder level, palms facing forward.","Press up until arms are nearly straight, DBs over your upper chest.","Lower slowly until elbows are just below shoulder height."],
    mist:"Common mistakes: bench too steep (turns it into a shoulder press); arching the lower back; clanging the DBs."},
  bb_bench:{name:"Barbell Bench Press", pat:"hpush", equip:"bb", start:45, inc:5, reps:[6,10], rest:120,
    cue:"The empty bar is 45 lb. If that's too much today, swap to dumbbells — the bar will wait.",
    how:["Lie with eyes under the bar, feet planted, shoulder blades pinched.","Grip slightly wider than shoulders, unrack with straight arms.","Lower the bar to mid-chest with elbows ~45° from your body.","Press back up to lockout. Use a spotter or safety arms while learning."],
    mist:"Common mistakes: bouncing the bar off the chest; flaring elbows to 90°; lifting hips off the bench. Never bench heavy without safeties."},
  push_up_incline:{name:"Incline Push-Up", pat:"hpush", equip:"bw", start:0, inc:0, reps:[6,12], rest:90,
    cue:"Hands on a bench or bar. Body straight, chest to the edge.",
    how:["Place hands shoulder-width on a bench, bar, or sturdy surface.","Walk feet back until your body is a straight line.","Lower your chest to the edge with elbows at ~45° from your body.","Push back up without letting your hips sag."],
    mist:"Common mistakes: hips sagging or piking; half-depth reps; hands too wide. Progress by using a lower surface."},
  cable_fly:{name:"Cable Chest Fly", pat:"hpush", equip:"cable", start:10, inc:5, reps:[10,15], rest:60,
    cue:"Slight elbow bend, hug a tree. Squeeze at the middle.",
    how:["Set both pulleys to chest height, grab a handle in each hand.","Step forward into a staggered stance, slight bend in the elbows.","Bring your hands together in front of your chest in a hugging arc.","Squeeze for a beat, then let your arms open slowly to a chest stretch."],
    mist:"Common mistakes: turning it into a press by bending elbows; letting the weight yank your arms back; leaning wildly forward."},

  /* --- vertical push / shoulders --- */
  db_shoulder_press:{name:"DB Shoulder Press (seated)", pat:"vpush", equip:"db", start:7.5, inc:2.5, reps:[8,12], rest:90,
    cue:"Ribs down, don't arch. Press to just short of lockout.",
    how:["Sit with back supported, DBs at shoulder height, palms forward.","Brace your core — ribs down, no arching.","Press straight up until arms are nearly locked out.","Lower with control back to shoulder height."],
    mist:"Common mistakes: arching the lower back to grind reps; pressing forward instead of up; wrists flaring back."},
  machine_shoulder_press:{name:"Machine Shoulder Press", pat:"vpush", equip:"machine", start:15, inc:5, reps:[8,12], rest:90,
    cue:"Adjust seat so handles start at shoulder height.",
    how:["Set the seat so the handles start level with your shoulders.","Grip handles, elbows under wrists.","Press up smoothly to near lockout.","Lower under control — don't let the stack touch down between reps."],
    mist:"Common mistakes: seat too low; shrugging; letting the stack slam."},
  bb_ohp:{name:"Barbell Overhead Press", pat:"vpush", equip:"bb", start:45, inc:5, reps:[5,8], rest:120,
    cue:"Empty bar = 45 lb — that's a serious weight overhead. Dumbbells are the smarter start; this is here for when you're ready.",
    how:["Grip the bar just outside shoulders, bar resting on front delts.","Brace your core hard — squeeze glutes, ribs down.","Press straight up, pulling your head slightly back out of the path.","Lock out overhead with biceps by your ears, lower with control."],
    mist:"Common mistakes: arching the lower back into a lean-back press; pressing around the face instead of moving the head; no leg drive is allowed — that's a different exercise."},
  db_lateral_raise:{name:"DB Lateral Raise", pat:"vpush", equip:"db", start:5, inc:2.5, reps:[12,15], rest:60,
    cue:"Lead with your elbows. Raise to shoulder height, no higher.",
    how:["Stand tall with a DB in each hand at your sides, slight elbow bend.","Raise arms out to the sides, leading with your elbows.","Stop at shoulder height — arms parallel to the floor.","Lower slowly for a 2-count."],
    mist:"Common mistakes: swinging with momentum; raising above shoulder height; shrugging. Light weight is correct here — for everyone, forever."},
  cable_lateral_raise:{name:"Cable Lateral Raise", pat:"vpush", equip:"cable", start:5, inc:2.5, reps:[12,15], rest:60,
    cue:"Cable at the lowest setting, stand side-on. Constant tension the whole way.",
    how:["Set the pulley to the bottom, stand side-on to the machine.","Grab the handle with your far hand, cable running across your body.","Raise your arm out to the side to shoulder height, elbow soft.","Lower slowly. All reps one side, then turn around."],
    mist:"Common mistakes: standing too close (no tension at the bottom); swinging; pulling with the traps."},

  /* --- vertical pull --- */
  lat_pulldown:{name:"Lat Pulldown", pat:"vpull", equip:"cable", start:25, inc:5, reps:[8,12], rest:90,

function equipOK(id){
  const eq = LIB[id].equip;
  if(eq==="bw") return true;
  const pref = (DB.profile.equip)||{db:true,bb:true,cable:true,machine:true};
  return pref[eq]!==false;
}
function poolFor(pat){
  const all = Object.keys(LIB).filter(id=>LIB[id].pat===pat);
  const ok = all.filter(equipOK);
  return ok.length?ok:all; // never let a filter empty a pool
}
function altsFor(exId){ return poolFor(LIB[exId].pat).filter(id=>id!==exId); }

/* ============================================================
   3. TRAINING ENGINE
   ============================================================ */
const today = () => new Date().toISOString().slice(0,10);
const fmtD = s => { const d=new Date(s+"T12:00"); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

function lastPerf(exId, excludeSessionId){
  for(let i=DB.sessions.length-1;i>=0;i--){
    const s = DB.sessions[i];
    if(s.id===excludeSessionId) continue;
    const e = (s.entries||[]).find(x=>x.ex===exId && x.sets && x.sets.length);
    if(e) return {date:s.date, sets:e.sets, pain:e.pain};
  }
  return null;
}
function prevMaxWeight(exId, excludeSessionId){
  let max = -1;
  const minR = LIB[exId].reps[0];
  for(const s of DB.sessions){
    if(s.id===excludeSessionId) continue;
    const e = (s.entries||[]).find(x=>x.ex===exId);
    if(e && e.sets) for(const st of e.sets){
      if(!st.pain && st.reps>=minR && st.w>max) max = st.w;
    }
  }
  return max;
}

function recommend(exId){
  const ex = LIB[exId];
  const hist = lastPerf(exId);
  if(!hist){
    return {weight:ex.start, basis:"No history yet — conservative starting point. We'll calibrate from today.", firstTime:true};
  }
  const sets = hist.sets;
  const lastW = sets[sets.length-1].w;
  const topReps = ex.reps[1], minReps = ex.reps[0];
  const allHitTop = sets.every(s=>s.reps>=topReps);
  const allHitMin = sets.every(s=>s.reps>=minReps);
  const maxRpe = Math.max(...sets.map(s=>s.rpe||7));
  const perf = sets.map(s=>`${s.w}×${s.reps}`).join(", ");
  const basisPrefix = `Last (${fmtD(hist.date)}): ${perf}` + (maxRpe?` @ RPE ${maxRpe}`:"");

  if(hist.pain) return {weight:Math.max(ex.start, lastW-Math.abs(ex.inc)), basis:basisPrefix+" — pain was flagged. Reduced load; stop again if it returns.", caution:true};
  if(allHitTop && maxRpe<=8 && ex.inc>0)
    return {weight:lastW+ex.inc, basis:basisPrefix+` — all sets hit ${topReps} with reps in reserve → small increase.`, up:true};
  if(allHitTop && ex.inc<=0)
    return {weight:ex.inc<0 ? Math.max(0,lastW+ex.inc) : lastW, basis:basisPrefix+(ex.inc<0?" — strong session → slightly less assist.":" — progress by adding reps or slowing tempo."), up:true};
  if(!allHitMin || maxRpe>=9.5)
    return {weight:Math.max(0,lastW-Math.abs(ex.inc)), basis:basisPrefix+` — below ${minReps} reps or near failure → step back to rebuild.`, down:true};
  return {weight:lastW, basis:basisPrefix+" — solid work in range. Same weight; own it before adding.", flat:true};
}

function liveAdjust(exId, set, setIdx, totalSets){
  const ex = LIB[exId];
  const remaining = totalSets - setIdx - 1;
  const nextN = setIdx+2;
  if(set.pain) return {tone:"bad", stop:true,
    text:"That's a pain flag, not fatigue — we stop this exercise now. Swap to a similar movement below, or skip ahead. If it's sharp or joint-related and lingers, get it looked at."};
  if(set.rpe>=10 || set.reps < ex.reps[0]-2){
    const w = Math.max(0,set.w-Math.abs(ex.inc||2.5));
    return {tone:"bad", drop:true, text:remaining>0
      ? F(rnd(FLAVOR.grindSet),{w, r:`${remaining} set${remaining>1?"s":""}`})
      : F(rnd(FLAVOR.grindFinal),{w})};
  }
  if(set.rpe>=9)
    return {tone:"warn", text:remaining>0 ? F(rnd(FLAVOR.hardSet),{w:set.w}) : rnd(FLAVOR.hardFinal)};
  if(set.rpe<=6 && set.reps>=ex.reps[1])
    return {tone:"good", text:remaining>0 ? F(rnd(FLAVOR.easySet),{w:set.w,n:nextN}) : rnd(FLAVOR.easyFinal)};
  return {tone:"good", text:remaining>0 ? F(rnd(FLAVOR.goodSet),{w:set.w,n:nextN}) : rnd(FLAVOR.goodFinal)};
}

function fillSlot(slot, slotIdx, typeCount, used){
  used = used || new Set();
  let pool = poolFor(slot.pat);
  if(slot.prefer){
    const pref = pool.filter(id=>slot.prefer.includes(id));
    if(pref.length) pool = pref;
  }
  const start = (typeCount + slotIdx) % pool.length;
  // first pass: skip used and pain-flagged; second: allow pain-free used; last resort: anything
  for(const allowUsed of [false,true]){
    for(let k=0;k<pool.length;k++){
      const id = pool[(start+k)%pool.length];
      if(!allowUsed && used.has(id)) continue;
      const h = lastPerf(id);
      if(!(h && h.pain)) return id;
    }
  }
  return pool[start];
}

/* The check-in matters. Every answer maps to a concrete change,
   and the plan lists each adjustment it made so you can see it. */
function checkinMods(checkin){
  const mods = [];
  let freeze=false, dropAccessory=false, extraRest=0, dropAll=false;
  if(checkin.sleep==="poor"){
    freeze=true;
    mods.push({tag:"Sleep", txt:"Rough night → no weight increases today. We bank reps at last session's loads and progress when you're rested."});
  }
  if(checkin.energy==="low"){
    dropAccessory=true; extraRest+=15;
    mods.push({tag:"Energy", txt:"Low tank → one set trimmed off accessory lifts and +15s rest between sets. Show up, don't show off."});
  }
  if(checkin.soreness==="everything"){
    dropAll=true;
    mods.push({tag:"Soreness", txt:"Everything's sore → one set trimmed everywhere. Moving helps; burying yourself doesn't."});
  }
  if(checkin.activity==="kickboxing"){
    freeze = freeze; extraRest+=0;
    mods.push({tag:"Kickboxing", txt:"Yesterday's class already taxed your legs and conditioning — lower body is deprioritized and leg progressions hold today."});
  }
  if(checkin.activity==="yoga") mods.push({tag:"Yoga", txt:"Yesterday's yoga counts as recovery — no adjustment needed, just credit."});
  if(checkin.activity==="walk") mods.push({tag:"Walk", txt:"Yesterday's walk logged as active recovery. Free health, no adjustment needed."});
  return {mods, freeze, dropAccessory, extraRest, dropAll,
    freezeLegs: checkin.activity==="kickboxing"};
}

function planToday(checkin, force){
  const t = today();
  const isBlocking = s => TEMPLATES[s.type] || ["walk","yoga"].includes(s.type); // cardio logs never block the lift
  const doneToday = DB.sessions.find(s=>s.date===t && s.status==="done" && isBlocking(s));
  const draftToday = DB.sessions.find(s=>s.date===t && s.status==="in-progress");
  const recent = DB.sessions.filter(s=>s.status==="done" && isBlocking(s)).slice(-8);
  const last = recent[recent.length-1];
  const daysSince = last ? daysBetween(last.date,t) : 99;
  let reason = [];

  if(draftToday && !force) return {kind:"draft", session:draftToday};
  if(doneToday && !force) return {kind:"done", session:doneToday};
  const beat = (checkin.sleep==="poor")+(checkin.energy==="low")+(checkin.soreness==="everything");
  if(beat>=2 && !force){
    return {kind:"recovery",
      why:"Poor sleep plus low energy is your body asking for an easy day, not a test of willpower. A 20–30 min walk or gentle yoga keeps the streak alive and you'll lift better tomorrow. Consistency is the goal — this counts."};
  }

  const cm = checkinMods(checkin);

  const lastDone = {};
  recent.forEach(s=>{ if(TEMPLATES[s.type]) lastDone[s.type]=s.date; });
  let order = ["A","B","C"].sort((a,b)=>(lastDone[a]||"0").localeCompare(lastDone[b]||"0"));
  if(checkin.soreness==="legs"){ order = order.filter(k=>k!=="B").concat("B"); reason.push("legs are still sore, so lower body waits"); }
  if(checkin.soreness==="upper"){ order = order.filter(k=>k==="B").concat(order.filter(k=>k!=="B")); reason.push("upper body is sore, so legs lead"); }
  if(checkin.activity==="kickboxing"){ order = order.filter(k=>k!=="B").concat("B"); }
  if(doneToday && force){
    order = order.filter(k=>k!==doneToday.type).concat(doneToday.type);
    reason.push("you already trained today, so this hits what's freshest — keep it light");
  }
  const pick = TEMPLATES[order[0]];
  const typeCount = DB.sessions.filter(s=>s.status==="done" && s.type===pick.key).length;

  if(last) reason.unshift(daysSince===1?`you trained yesterday (${TEMPLATES[last.type]?TEMPLATES[last.type].label:last.type})`:`last session was ${daysSince} days ago`);
  else reason.unshift("this is your first logged session — we start conservative and calibrate");

  let slots = pick.slots.slice();
  let hourglassNote = "";
  if(DB.profile.hourglass){
    if(pick.key==="A"){ slots.push({pat:"vpush", pri:2, prefer:["db_lateral_raise","cable_lateral_raise"]}); hourglassNote="Hourglass focus: extra side-delt work added — wider shoulder line, smaller-looking waist by contrast."; }
    if(pick.key==="B"){ slots.push({pat:"glute", pri:2}); hourglassNote="Hourglass focus: extra glute work added. The training builds the curves; nutrition reveals the waist."; }
    if(pick.key==="C"){ slots.push({pat:"glute", pri:2}); hourglassNote="Hourglass focus: glute accessory added to round out the pull day."; }
  }
  let setsPer = 3, note = "";
  if(checkin.time<=20){ slots = slots.filter(s=>s.pri===1).slice(0,3); setsPer=2; note="Short on time: core lifts only, 2 sets each. This preserves what matters most."; }
  else if(checkin.time<=30){ slots = slots.filter(s=>s.pri===1); setsPer=3; note="30-minute version: priority lifts only."; }
  else if(checkin.time>=60){ note="You have time — but we're not adding junk volume. Finish, then let the cardio card below handle the rest."; }
  if(checkin.time>30 && hourglassNote) note = note?note+" "+hourglassNote:hourglassNote;

  const legPats = ["squat","hinge","glute","calf"];
  const used = new Set();
  const entries = slots.map((slot,i)=>{
    const id = fillSlot(slot, i, typeCount, used);
    used.add(id);
    const ex = LIB[id];
    const rec = recommend(id);
    let weight = rec.weight;
    let basis = rec.basis;
    let sets = setsPer;
    // apply check-in modifiers, visibly
    const frozen = (cm.freeze || (cm.freezeLegs && legPats.includes(ex.pat)));
    if(frozen && rec.up && ex.inc!==0 && !rec.firstTime){
      weight = weight - ex.inc;
      basis += " (increase earned but held for today — see check-in adjustments)";
    }
    if(cm.dropAll || (cm.dropAccessory && slot.pri===2)) sets = Math.max(2, sets-1);
    return {ex:id, slotPat:slot.pat, target:{sets, reps:ex.reps, weight, rest:ex.rest+cm.extraRest}, rec:{...rec, basis}, sets:[]};
  });
  const est = entries.reduce((m,e)=>m + e.target.sets*(LIB[e.ex].rest+cm.extraRest+40)/60, 0);
  return {kind:"lift", template:pick, entries, why:reason.join("; ")+".", note, est:Math.round(est), mods:cm.mods};
}

/* ============================================================
   3a. CARDIO ENGINE — what, how long, what settings, and why
   ============================================================ */
function cardioWeekMinutes(){
  const t = today();
  return DB.sessions.filter(s=>s.status==="done" && daysBetween(s.date,t)<7)
    .reduce((m,s)=>{
      if(s.type==="cardio" && s.data) return m + (s.data.min||0);
      if(s.type==="walk") return m + 25;
      if(s.type==="yoga") return m + 0;
      return m;
    },0);
}
const CARDIO_TARGET = 120; // moderate minutes per week — health + fat loss support without eating recovery
function recommendCardio(checkin, planKind, liftType){
  const wk = cardioWeekMinutes();
  const tired = checkin && (checkin.sleep==="poor" || checkin.energy==="low");
  const base = {week:wk, target:CARDIO_TARGET};
  if(checkin && checkin.activity==="kickboxing")
    return {...base, title:"Optional today", kind:"easy walk", min:15,
      setting:"Any pace that feels like a stroll.",
      why:"Yesterday's kickboxing already covered your hard cardio. Anything today is bonus, not homework."};
  if(planKind==="recovery")
    return {...base, title:"Today's cardio IS the workout", kind:"brisk walk", min:tired?20:35,
      setting:"Outside if you can. Pace where talking is easy but singing isn't. Bike alternative: light resistance, 90+ rpm.",
      why:"On a recovery day, easy cardio speeds recovery and quietly banks fat-loss minutes without touching your muscles' repair budget."};
  if(liftType==="B")
    return {...base, title:"After today's legs", kind:"easy spin or flat walk", min:tired?8:10,
      setting:"Bike: resistance low enough to chat comfortably (~4/10 effort). Treadmill: 2.5–3.0 mph, 0% incline.",
      why:"Legs did the real work today. This is a flush, not a session — it helps soreness, it doesn't burn recovery."};
  // after upper / full days — the main cardio slot
  return {...base, title:"After today's lifting", kind:"incline walk", min:tired?12:18,
    setting:"Treadmill: 3.0 mph, 6–8% incline (drop to 4% if that's spicy). You should manage short sentences, not speeches. Bike/elliptical: steady ~5/10 effort.",
    why:"Incline walking burns meaningfully without beating up your legs before their next session — the sweet spot for fat loss alongside lifting."};
}

/* ============================================================
   3c. NUTRITION ENGINE — targets from HER data, with a floor
   ============================================================ */
function latestBW(){ const b=DB.bodyweight; return b.length?b[b.length-1].w:136; }
function nutritionTargets(){
  const p = DB.profile;
  if(!p.age) return null;
  const kg = latestBW()*0.4536, cm = 154.9; // 5'1"
  const bmr = 10*kg + 6.25*cm - 5*p.age - 161; // Mifflin-St Jeor (women)
  const mult = {sedentary:1.2, light:1.375, moderate:1.55, active:1.725}[p.activityLvl]||1.375;
  const tdee = Math.round(bmr*mult);
  let kcal = tdee - p.deficit;
  let floored = false;
  if(kcal < 1200){ kcal = 1200; floored = true; } // hard floor — below this you lose muscle and sanity, not fat
  const protein = Math.round(latestBW()*0.9); // ~0.9 g/lb — the muscle-keeping lever
  return {tdee, kcal, protein, floored, deficit:tdee-kcal};
}
function todayNutrition(){
  const list = DB.nutrition[today()]||[];
  return {list, kcal:list.reduce((m,e)=>m+(e.k||0),0), protein:list.reduce((m,e)=>m+(e.p||0),0)};
}
function weekNutrition(){
  const t=today(); let days=0,k=0,p=0;
  for(const [d,list] of Object.entries(DB.nutrition)){
    if(daysBetween(d,t)<7 && list.length){ days++; k+=list.reduce((m,e)=>m+(e.k||0),0); p+=list.reduce((m,e)=>m+(e.p||0),0); }
  }
  return days?{days, kcal:Math.round(k/days), protein:Math.round(p/days)}:null;
}


let AC = null;
function armAudio(){
  if(!DB.profile.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
  }catch(e){}
}
function restAlert(){
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200]); }catch(e){} }
  if(!DB.profile.sound || !AC) return;
  try{
    const t0 = AC.currentTime;
    [0,.18,.36].forEach((dt,i)=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="sine"; o.frequency.value = i===2?1046:784; // G5 G5 C6
      g.gain.setValueAtTime(.0001,t0+dt);
      g.gain.exponentialRampToValueAtTime(.25,t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.15);
      o.connect(g); g.connect(AC.destination);
      o.start(t0+dt); o.stop(t0+dt+.16);
    });
  }catch(e){}
}

/* ---------- LIVE WORKOUT ---------- */
function startWorkout(){
  armAudio();
  live = {sessionId:Date.now(), date:today(), type:plan.template.key,
    entries:plan.entries.map(e=>({...e, sets:[], skipped:false, pain:false})),
    idx:0, curW:plan.entries[0].target.weight, curReps:defaultReps(plan.entries[0]), curRpe:7, curPain:false,
    coach:null, restLeft:0, restLine:"", guideOpen:false, prCount:0};
  renderLive();
}
function defaultReps(e){ return LIB[e.ex].reps[1]; }

function resumeSession(id){
  const s = DB.sessions.find(x=>x.id===id);
  if(!s) return;
  armAudio();
  const entries = (s.entries||[]).map(e=>{
    const rec = e.rec || recommend(e.ex);
    const target = e.target || {sets:Math.max(3,(e.sets||[]).length), reps:LIB[e.ex].reps, weight:rec.weight, rest:LIB[e.ex].rest};
    return {ex:e.ex, target, rec, sets:e.sets||[], skipped:!!e.skipped, pain:!!e.pain};
  });
  let idx = entries.findIndex(e=>!e.skipped && e.sets.length < e.target.sets);
  if(idx<0) idx = entries.length-1;
  s.status = "in-progress";
  live = {sessionId:s.id, date:s.date, type:s.type, entries, idx,
    curW:entries[idx]? (entries[idx].sets.length?entries[idx].sets[entries[idx].sets.length-1].w:entries[idx].target.weight) : 0,
    curReps:entries[idx]?defaultReps(entries[idx]):10, curRpe:7, curPain:false, coach:null, restLeft:0, restLine:"", guideOpen:false, prCount:0};
  saveDB();
  view="today"; ["Today","History","Coach"].forEach(t=>$("tab"+t).classList.toggle("on", t==="Today"));
  renderLive();
}

function renderLive(){
  clearInterval(restInterval);
  const v = $("view");

  const e = L.entries[L.idx];
  const ex = LIB[e.ex];

  const finished = e.sets.length >= e.target.sets || e.skipped;
  const dots = Array.from({length:Math.max(e.target.sets, e.sets.length)},(_,i)=>
    `<span class="${i<e.sets.length?(i<e.target.sets?"done":"done extra"):""}"></span>`).join("");
  const inc = Math.abs(ex.inc)||2.5;
  const logged = e.sets.length?`<div class="loggedsets">Logged: ${e.sets.map(s=>`${s.w}×${s.reps}${s.pain?"⚠":""}`).join(", ")}</div>`:"";
  const alts = altsFor(e.ex);
  const guide = L.guideOpen?`<div class="guide">
      <ol>${ex.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol>

    </div>`:"";

  v.innerHTML = `
  <div class="now">
    <div class="eyebrow">Exercise ${L.idx+1} of ${L.entries.length} · rest ${e.target.rest||ex.rest}s between sets</div>

    ${guide}
    <div class="setdots">${dots}</div>
    ${logged}
    <div class="setlabel">${finished?"Target sets complete":"Set "+setNo+" of "+e.target.sets} · target ${ex.reps[0]}–${ex.reps[1]}${ex.timed?" sec":""} · ~2–3 reps in reserve</div>

    <div class="bignum">
      <button class="step" onclick="bump('w',-${inc})">−</button>
      <div><div class="val" id="wVal">${L.curW}</div></div>
      <button class="step" onclick="bump('w',${inc})">+</button>
      <div class="unit">${ex.inc? "lb":"bw"}</div>
    </div>

    <div class="setlabel" style="text-align:center">${ex.timed?"seconds held":"reps done"}</div>
    <div class="minirow">
      <button class="step sm" onclick="bump('r',-1)">−</button>
      <div class="val2" id="rVal">${L.curReps}</div>
      <button class="step sm" onclick="bump('r',1)">+</button>
    </div>

    <div class="setlabel">How hard was it? (RPE)</div>
    <div class="rpes" id="rpeRow">
      ${[6,7,8,9,10].map(r=>`<button data-r="${r}" class="${L.curRpe===r&&!L.curPain?"on":""}" onclick="setRpe(${r})">${r}</button>`).join("")}
      <button class="pain ${L.curPain?"on":""}" onclick="togglePain()">Pain</button>
    </div>

    ${L.pr?`<div class="coachline pr">${esc(L.pr)}</div>`:""}
    ${L.coach?`<div class="coachline ${L.coach.tone}">${esc(L.coach.text)}</div>`:""}
    ${L.restLeft>0?`<div class="resttimer" id="restBox">Rest: <b id="restT">${L.restLeft}</b>s — log your next set whenever you're ready<span class="quip">${esc(L.restLine)}</span></div>`:""}

    <div style="margin-top:14px">
      ${finished
        ? `<button class="btn" onclick="nextExercise()">${L.idx<L.entries.length-1?"Next exercise →":"Finish workout ✓"}</button>
           <button class="btn quiet" onclick="logSet()">Add another set</button>`
        : `<button class="btn" onclick="logSet()">Log set ${setNo}</button>`}
    </div>
    <div class="navrow">
      ${L.idx>0?`<button class="btn quiet" onclick="prevExercise()">← Back</button>`:""}
      ${e.sets.length?`<button class="btn quiet" onclick="undoSet()">Undo last set</button>`:""}
      ${!finished && L.idx<L.entries.length-1?`<button class="btn quiet" onclick="nextExercise()">Skip for now →</button>`:""}
    </div>
    <div class="navrow">
      ${alts.length?`<button class="btn ghost" onclick="openSwapLive()">⇄ Swap exercise</button>`:""}
      <button class="btn ghost ${confirmState.skip?"confirming":""}" onclick="skipExercise()">${confirmState.skip?"Tap again to skip":"Mark as skipped"}</button>
    </div>
    ${L.swapOpen?`<div class="picker" style="margin-top:8px">${alts.map(id=>{
        const r = recommend(id);
        return `<button onclick="doSwapLive('${id}')"><span>${esc(LIB[id].name)} ${eqTag(id)}</span><span class="w">${r.weight>0?r.weight+" lb":"bodyweight"}</span></button>`;
      }).join("")}<button onclick="closeSwapLive()"><span>Cancel</span><span></span></button></div>`:""}
  </div>
  <button class="btn ${confirmState.end?"confirming":"danger"}" onclick="endEarly()">${confirmState.end?"Tap again to save & end":"End workout here"}</button>`;
  if(L.restLeft>0) startRestTick();
}
function toggleGuide(){ live.guideOpen=!live.guideOpen; renderLive(); }
function bump(k,d){
  if(k==="w"){ live.curW=Math.max(0, Math.round((live.curW+d)*10)/10); $("wVal").textContent=live.curW; }
  else{ live.curReps=Math.max(0, live.curReps+d); $("rVal").textContent=live.curReps; }
}
function setRpe(r){ live.curRpe=r; live.curPain=false; renderLive(); }
function togglePain(){ live.curPain=!live.curPain; renderLive(); }

function logSet(){
  armAudio();
  const L=live, e=L.entries[L.idx], ex=LIB[e.ex];
  const set = {w:L.curW, reps:L.curReps, rpe:L.curPain?null:L.curRpe, pain:L.curPain};
  // PR check against everything before this set (other sessions + this session's earlier sets on this exercise)
  const histMax = Math.max(prevMaxWeight(e.ex, L.sessionId), ...e.sets.filter(s=>!s.pain&&s.reps>=ex.reps[0]).map(s=>s.w), -1);
  const isPR = !set.pain && set.reps>=ex.reps[0] && histMax>-1 && set.w>histMax;
  e.sets.push(set);
  e.skipped = false;
  if(set.pain) e.pain = true;
  if(isPR) L.prCount++;
  L.pr = isPR ? rnd(FLAVOR.pr) : null;
  const adj = liveAdjust(e.ex, set, e.sets.length-1, e.target.sets);
  L.coach = adj;
  if(adj.drop) L.curW = Math.max(0, L.curW - Math.abs(ex.inc||2.5));
  L.curPain = false;
  L.restLeft = (e.sets.length < e.target.sets && !adj.stop) ? (e.target.rest||ex.rest) : 0;
  L.restLine = rnd(FLAVOR.rest);
  persistLiveDraft();
  renderLive();
}
function undoSet(){
  const e = live.entries[live.idx];
  const removed = e.sets.pop();
  if(removed){ live.curW = removed.w; live.curReps = removed.reps; }
  e.pain = e.sets.some(s=>s.pain);
  live.coach = null; live.pr = null; live.restLeft = 0;
  persistLiveDraft();
  renderLive();
}
function startRestTick(){
  clearInterval(restInterval);
  restInterval = setInterval(()=>{
    live.restLeft--;
    const t=$("restT");
    if(t) t.textContent=Math.max(0,live.restLeft);
    if(live.restLeft<=0){
      clearInterval(restInterval);
      restAlert();
      const box=$("restBox");
      if(box){ box.classList.add("restdone"); box.innerHTML="<b>Rest over — next set when ready.</b>"; }
      setTimeout(()=>{ if(live) renderLive(); }, 1800);
    }
  },1000);
}
function gotoExercise(newIdx){
  const L=live;
  L.idx = newIdx; L.coach=null; L.pr=null; L.restLeft=0; L.curPain=false; L.curRpe=7; L.swapOpen=false; L.guideOpen=false;
  confirmState = {};
  const e = L.entries[L.idx];
  L.curW = e.sets.length ? e.sets[e.sets.length-1].w : e.target.weight;
  L.curReps = defaultReps(e);
  renderLive();
}
function nextExercise(){
  if(live.idx >= live.entries.length-1){ finishWorkout(); return; }
  gotoExercise(live.idx+1);
}
function prevExercise(){ if(live.idx>0) gotoExercise(live.idx-1); }
function openSwapLive(){ live.swapOpen=true; renderLive(); }
function closeSwapLive(){ live.swapOpen=false; renderLive(); }
function doSwapLive(newId){
  const L=live, e=L.entries[L.idx];
  const rec = recommend(newId);
  L.entries[L.idx] = {ex:newId, target:{sets:e.target.sets, reps:LIB[newId].reps, weight:rec.weight, rest:LIB[newId].rest}, rec, sets:[], skipped:false, pain:false};
  L.swapOpen=false;
  gotoExercise(L.idx);
}
function skipExercise(){
  if(!confirmState.skip){ confirmState.skip=true; renderLive(); setTimeout(()=>{ if(confirmState.skip){confirmState.skip=false; if(live) renderLive();} }, 2500); return; }
  confirmState.skip=false;
  live.entries[live.idx].skipped=true;
  persistLiveDraft();
  if(live.idx >= live.entries.length-1) finishWorkout(); else gotoExercise(live.idx+1);
}
function endEarly(){
  if(!confirmState.end){ confirmState.end=true; renderLive(); setTimeout(()=>{ if(confirmState.end){confirmState.end=false; if(live) renderLive();} }, 2500); return; }
  confirmState.end=false;
  finishWorkout(true);
}

function persistLiveDraft(){
  const L=live;
  const i = DB.sessions.findIndex(s=>s.id===L.sessionId);
  const rec = {id:L.sessionId, date:L.date, type:L.type, status:"in-progress",
    entries:L.entries.map(e=>({ex:e.ex, target:e.target, sets:e.sets, skipped:e.skipped, pain:e.pain}))};
  if(i>=0) DB.sessions[i]=rec; else DB.sessions.push(rec);
  saveDB();
}
function finishWorkout(early){
  clearInterval(restInterval);
  const L=live;
  const i = DB.sessions.findIndex(s=>s.id===L.sessionId);
  const rec = {id:L.sessionId, date:L.date, type:L.type, status:"done", early:!!early,
    entries:L.entries.map(e=>({ex:e.ex, target:e.target, sets:e.sets, skipped:e.skipped, pain:e.pain}))
      .filter(e=>e.sets.length||e.skipped)};
  if(i>=0) DB.sessions[i]=rec; else DB.sessions.push(rec);
  saveDB();
  const savedId = L.sessionId;
  const prCount = L.prCount;
  live=null;
  const done = rec.entries.filter(e=>e.sets.length).length;
  plan = planToday(checkin||{sleep:"ok",energy:"ok",soreness:"none",time:45,activity:"none"});
  $("view").innerHTML = `<div class="card"><h2>${early?"Logged — partial counts.":"Workout saved ✓"}</h2>
    <p class="muted">${esc(early?rnd(FLAVOR.finishEarly):rnd(FLAVOR.finish))}</p>
    ${prCount?`<div class="coachline pr">${prCount} PR${prCount>1?"s":""} today. The log remembers everything.</div>`:""}
    <p class="muted small" style="margin-top:8px">${done} exercise${done!==1?"s":""} logged. You can resume, add to it, or fix any numbers — nothing is locked.</p>
    ${sessionLines(rec)}
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" onclick="resumeSession(${savedId})">Resume / add more</button>
      <button class="btn ghost" onclick="startEdit(${savedId})">Fix the log</button>
    </div>
    <button class="btn" style="margin-top:8px" onclick="go('today')">Done</button></div>`;
}
function sessionLines(s){
  const lines = (s.entries||[]).map(e=>{
    const nm = LIB[e.ex]?LIB[e.ex].name:e.ex;
    if(e.skipped && !(e.sets&&e.sets.length)) return `<div>${esc(nm)} — skipped</div>`;
    const str = (e.sets||[]).map(x=>`${x.w}×${x.reps}${x.pain?"⚠":""}`).join(", ");
    return `<div>${esc(nm)}: ${str}</div>`;
  }).join("");
  return `<div class="sess"><div class="lines">${lines||'<span class="muted">Recovery activity</span>'}</div></div>`;
}

function renderEditor(){

      <div class="editset">
        <input type="number" inputmode="decimal" step="0.5" value="${st.w}" onchange="editSetVal(${ei},${si},'w',this.value)"> lb ×
        <input type="number" inputmode="numeric" value="${st.reps}" onchange="editSetVal(${ei},${si},'reps',this.value)"> reps
        <button class="x" onclick="deleteSet(${ei},${si})">✕</button>
      </div>`).join("");
    return `<div class="editex"><div class="nm">${esc(nm)}${e.skipped&&!(e.sets||[]).length?" (skipped)":""}</div>${rows}
      <button class="editlink" onclick="addSetTo(${ei})">+ add a set</button>
      <button class="editlink" style="color:var(--bad)" onclick="deleteEntry(${ei})">remove exercise</button>
    </div>`;
  }).join("");
  return `<div class="card"><h2>Edit log — ${fmtD(s.date)}</h2>
    <p class="muted small">Fix any weight or rep count. Changes feed straight back into the engine's recommendations.</p>
    ${exBlocks||'<p class="muted">No exercises in this session.</p>'}
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="closeEditor()">Save & close</button>
    </div>
    <button class="btn danger" style="margin-top:8px" onclick="deleteSession()">Delete this whole session</button>
  </div>`;
}
function _editS(){ return DB.sessions.find(x=>x.id===editingSession); }
function editSetVal(ei,si,k,val){
  const s=_editS(); if(!s) return;
  const n = parseFloat(val);
  if(isNaN(n)||n<0) return;
  s.entries[ei].sets[si][k] = k==="reps"?Math.round(n):n;
  saveDB();
}
function deleteSet(ei,si){
  const s=_editS(); if(!s) return;
  s.entries[ei].sets.splice(si,1);
  saveDB(); renderHistory();
}
function addSetTo(ei){
  const s=_editS(); if(!s) return;
  const sets = s.entries[ei].sets;
  const lastSet = sets[sets.length-1] || {w:LIB[s.entries[ei].ex]?LIB[s.entries[ei].ex].start:10, reps:10};
  sets.push({w:lastSet.w, reps:lastSet.reps, rpe:7});
  s.entries[ei].skipped=false;
  saveDB(); renderHistory();
}
function deleteEntry(ei){
  const s=_editS(); if(!s) return;
  s.entries.splice(ei,1);
  saveDB(); renderHistory();
}
function deleteSession(){
  DB.sessions = DB.sessions.filter(x=>x.id!==editingSession);
  editingSession=null; saveDB();
  if(checkin) plan = planToday(checkin);
  render();
}
function closeEditor(){ editingSession=null; if(checkin) plan = planToday(checkin); render(); }

/* ---------- HISTORY ---------- */
function renderHistory(){
  const v=$("view");
  if(editingSession){ v.innerHTML = renderEditor(); return; }
  const done = DB.sessions.filter(s=>s.status==="done").slice().reverse();
  const exIds = [...new Set(done.flatMap(s=>(s.entries||[]).filter(e=>e.sets&&e.sets.length).map(e=>e.ex)))];
  const progRows = exIds.map(id=>{
    const pts=[];
    for(const s of DB.sessions){ const e=(s.entries||[]).find(x=>x.ex===id&&x.sets&&x.sets.length); if(e){ pts.push(Math.max(...e.sets.map(x=>x.w))); } }
    const last3 = pts.slice(-3);
    const trend = last3.length>1 ? (last3[last3.length-1]>last3[0]?"up":last3[last3.length-1]<last3[0]?"down":"flat") : "flat";
    const arrow = trend==="up"?"▲":trend==="down"?"▽":"—";
    return `<div class="prog"><div>${esc(LIB[id]?LIB[id].name:id)}</div><div class="tr">${last3.join(" → ")} lb <span class="${trend}">${arrow}</span></div></div>`;
  }).join("");
  const sessHtml = done.slice(0,14).map(s=>{
    let label = TEMPLATES[s.type]?TEMPLATES[s.type].label:cap(s.type);
    if(s.type==="cardio" && s.data) label = `Cardio · ${cap(s.data.kind)} ${s.data.min} min (${s.data.intensity})`;
    return `<div class="sess"><div class="top"><div>${esc(label)}</div><div class="d">${fmtD(s.date)}</div></div>${s.type==="cardio"?"":sessionLines(s)}
      ${TEMPLATES[s.type]?`<button class="editlink" onclick="startEdit(${s.id})">✎ Edit this log</button>`:""}</div>`;
  }).join("");
  const bw = DB.bodyweight.slice(-1)[0];
  const lastM = DB.measure.slice(-1)[0];
  const mRows = DB.measure.slice(-4).map(m=>{
    const r = m.hips? (m.waist/m.hips).toFixed(2) : "—";
    return `<div class="prog"><div>${fmtD(m.date)}</div><div class="tr">waist ${m.waist}" · hips ${m.hips}" · ratio ${r}</div></div>`;
  }).join("");
  v.innerHTML = `
    <div class="card"><h2>Strength trend</h2>${progRows||'<p class="muted">Log your first workout and this fills in automatically.</p>'}</div>
    <div class="card"><h2>Shape (waist & hips)</h2>
      <p class="muted small">The hourglass metric. Measure relaxed, same time of day, weekly at most — waist at the narrowest point, hips at the widest. A falling ratio means it's working, whatever the scale mumbles.</p>
      <div class="row" style="margin-top:8px">
        <input id="mWaist" type="number" inputmode="decimal" step="0.25" placeholder="${lastM?'waist '+lastM.waist+'\" last':'waist (in)'}" style="flex:1;background:var(--plate);border:1px solid var(--steel);border-radius:12px;color:var(--chalk);padding:12px;font-size:16px">
        <input id="mHips" type="number" inputmode="decimal" step="0.25" placeholder="${lastM?'hips '+lastM.hips+'\" last':'hips (in)'}" style="flex:1;background:var(--plate);border:1px solid var(--steel);border-radius:12px;color:var(--chalk);padding:12px;font-size:16px">
        <button class="btn" style="width:80px" onclick="logMeasure()">Log</button>
      </div>
      ${mRows?`<div style="margin-top:8px">${mRows}</div>`:""}
    </div>
    <div class="card"><h2>Bodyweight</h2>
      <p class="muted small">${esc(rnd(FLAVOR.bwSub))}</p>
      <div class="row">
        <input id="bwIn" type="number" inputmode="decimal" placeholder="${bw?bw.w+" lb last":"e.g. 136"}" style="flex:1;background:var(--plate);border:1px solid var(--steel);border-radius:12px;color:var(--chalk);padding:12px;font-size:16px">
        <button class="btn" style="width:90px" onclick="logBW()">Log</button>
      </div>
      ${bwTrend()}
    </div>
    <div class="card"><h2>Sessions</h2>${sessHtml||`<p class="muted">${esc(rnd(FLAVOR.emptyHistory))}</p>`}
      <div class="row">
        <button class="btn quiet" onclick="exportData()">Export backup</button>
        <button class="btn quiet" onclick="$('importFile').click()">Import backup</button>
      </div>
      <input id="importFile" type="file" accept=".json" class="hide" onchange="importData(this)">
    </div>`;
}
function logBW(){
  const val = parseFloat($("bwIn").value);
  if(!val||val<60||val>400) return;
  DB.bodyweight.push({date:today(), w:val}); saveDB(); renderHistory();
}
function logMeasure(){
  const waist = parseFloat($("mWaist").value), hips = parseFloat($("mHips").value);
  if(!waist||!hips||waist<15||waist>80||hips<20||hips>90){ toastBanner("Enter both waist and hips in inches."); return; }
  DB.measure.push({date:today(), waist, hips});
  saveDB(); renderHistory();
}
function bwTrend(){
  const b=DB.bodyweight;
  if(b.length<2) return "";
  const first=b[0], lastB=b[b.length-1];
  const d=(lastB.w-first.w).toFixed(1);
  return `<p class="muted small" style="margin-top:8px">${first.w} → ${lastB.w} lb since ${fmtD(first.date)} (${d>0?"+":""}${d} lb)</p>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="ironlog-backup.json"; a.click();
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.sessions)) throw 0;
      DB=d;
      DB.profile = DB.profile||{};
      if(!DB.profile.equip) DB.profile.equip={db:true,bb:true,cable:true,machine:true};
      if(DB.profile.sound===undefined) DB.profile.sound=true;
      saveDB(); renderHistory();
      toastBanner("Backup restored — "+d.sessions.length+" sessions loaded.");
    }catch(e){ toastBanner("That file isn't an Iron Log backup."); }
  };
  rd.readAsText(f);
}

/* ---------- AI COACH ---------- */
function historyDigest(){
  const done = DB.sessions.filter(s=>s.status==="done").slice(-10);
  const lines = done.map(s=>{
    const label = TEMPLATES[s.type]?TEMPLATES[s.type].label:s.type;
    const ex = (s.entries||[]).map(e=>{
      const nm = LIB[e.ex]?LIB[e.ex].name:e.ex;
      if(!e.sets||!e.sets.length) return nm+" (skipped)";
      return nm+" "+e.sets.map(x=>`${x.w}×${x.reps}${x.rpe?`@${x.rpe}`:""}${x.pain?"(pain)":""}`).join(",");
    }).join("; ");
    return `${s.date} ${label}: ${ex||"recovery"}`;
  });
  const bw = DB.bodyweight.slice(-6).map(b=>`${b.date}:${b.w}lb`).join(", ");
  const cardio = DB.sessions.filter(s=>s.type==="cardio"&&s.data&&daysBetween(s.date,today())<7)
    .map(s=>`${s.date} ${s.data.kind} ${s.data.min}min(${s.data.intensity})`).join(", ");
  const T = nutritionTargets();
  const N = todayNutrition();
  const wkN = weekNutrition();
  const meas = DB.measure.slice(-3).map(m=>`${m.date} waist:${m.waist}" hips:${m.hips}" ratio:${(m.waist/m.hips).toFixed(2)}`).join("; ");
  return `PROFILE: 5'1", ~${latestBW()} lb, goal = hourglass physique (build shoulders/glutes, reveal waist via modest deficit), sustainable routine, returning after inconsistency, current strength ~5-10 lb range on many lifts.
RECENT SESSIONS (real logged data, do not invent any):\n${lines.join("\n")||"none yet"}
CARDIO LAST 7 DAYS: ${cardio||"none logged"} (weekly target ~120 moderate min)
NUTRITION: ${T?`targets ${T.kcal} kcal / ${T.protein}g protein (maintenance ~${T.tdee}); today so far ${N.kcal} kcal / ${N.protein}g; 7-day avg ${wkN?wkN.kcal+" kcal / "+wkN.protein+"g over "+wkN.days+" logged days":"no days logged"}`:"targets not set up yet"}
MEASUREMENTS: ${meas||"none yet"}
BODYWEIGHT LOG: ${bw||"none"}
TODAY'S CHECK-IN: ${checkin?JSON.stringify(checkin):"not done yet"}`;
}
function getApiKey(){ try{ return localStorage.getItem("ironlog-api-key")||""; }catch(e){ return ""; } }
function saveApiKey(){
  const val = $("apiKeyIn").value.trim();
  if(!val) return;
  localStorage.setItem("ironlog-api-key", val);
  renderCoach();
}
function clearApiKey(){ localStorage.removeItem("ironlog-api-key"); chatMsgs=[]; renderCoach(); }

async function sendChat(){
  const ta=$("chatIn"); const text=ta.value.trim();
  if(!text||chatBusy) return;
  ta.value="";
  chatMsgs.push({role:"user", content:text});
  chatBusy=true; renderCoach();
  const sys = `You are Nourin's personal strength coach inside her workout tracking app. A deterministic engine already picks weights/sets from her logged history — your job is coaching judgment: answering questions, weekly review, form, meal ideas that fit her computed targets, adjusting for schedule, motivation without cheerleading. Personality: dry wit, warm, a little playful — but always sincere about pain, injuries, recovery, and food struggles. Rules: base everything on the real data below and never invent history; favor 2-4 reps in reserve; never push through pain and recommend professional evaluation for sharp/joint pain; never punish missed workouts or over-target days; nutrition advice stays moderate — never suggest eating below her computed floor, no crash diets, no demonizing foods, protein-first framing; no excessive cardio; keep answers short and concrete (she may be mid-workout). Data:\n\n${historyDigest()}`;
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json",
        "x-api-key":getApiKey(),
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, system:sys,
        messages:[...chatMsgs]})});
    const data = await r.json();
    if(data.error){
      chatMsgs.push({role:"assistant", content:"API error: "+(data.error.message||data.error.type)+". Check your key in settings below."});
    }else{
      const reply = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      chatMsgs.push({role:"assistant", content:reply||"(no response — try again)"});
    }
  }catch(err){
    chatMsgs.push({role:"assistant", content:"Couldn't reach the coach — check your connection. Your training data is safe on this device."});
  }
  chatBusy=false; renderCoach();
}
function renderCoach(){
  const v=$("view");
  if(!getApiKey()){
    v.innerHTML = `
      <div class="card"><h2>Coach — one-time setup</h2>
        <p class="muted">The AI coach runs on your own Anthropic API key. It's stored only on this phone — never in the app's code or on any server — and each chat costs a fraction of a cent.</p>
        <p class="muted small" style="margin-top:8px">Get a key at console.anthropic.com → API Keys → Create Key, then paste it here.</p>
        <input id="apiKeyIn" type="password" placeholder="sk-ant-…" autocomplete="off"
          style="width:100%;margin-top:10px;background:var(--plate);border:1px solid var(--steel);border-radius:12px;color:var(--chalk);padding:12px;font-size:15px">
        <button class="btn" style="margin-top:10px" onclick="saveApiKey()">Save key on this device</button>
        <p class="muted small" style="margin-top:10px">Everything else — workouts, engine, logging, history — works fully without it.</p>
      </div>`;
    return;
  }
  const msgs = chatMsgs.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("");
  v.innerHTML = `
    <div class="card"><h2>Coach</h2>
      <p class="muted small">Knows your full training log. Ask for a weekly review, form help, or how to rearrange the week. The engine sets your numbers — the coach explains and adapts.</p>
    </div>
    <div class="chat">${msgs||'<div class="msg ai">Ask me anything — "how am I progressing?", "I only have 20 minutes Thursday", "my shoulder felt weird on presses".</div>'}
    ${chatBusy?'<div class="msg ai"><span class="spin"></span> thinking…</div>':""}</div>
    <div class="chatbar">
      <textarea id="chatIn" placeholder="Message your coach…"></textarea>
      <button onclick="sendChat()">Send</button>
    </div>
    <button class="btn quiet" onclick="clearApiKey()">Remove API key from this device</button>`;
  const c=v.querySelector(".chat"); if(c) window.scrollTo(0, document.body.scrollHeight);
}

/* ---------- boot ---------- */
(async function(){
  $("dateChip").textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  await loadDB();
  DB.sessions.forEach(s=>{ if(s.status==="in-progress" && s.date!==today()) s.status="done"; });
  saveDB();
  render();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
